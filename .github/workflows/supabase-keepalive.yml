name: Supabase Keepalive

# Mantiene el proyecto de Supabase (free tier) activo ejecutando un SELECT
# trivial contra PostgREST cada 3 dias. Supabase pausa proyectos tras ~7 dias
# de inactividad de DB, asi que hay margen amplio.

on:
  schedule:
    # Cada 3 dias a las 09:00 UTC
    - cron: "0 9 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping Supabase REST
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query trivial contra PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Faltan secrets SUPABASE_URL o SUPABASE_ANON_KEY"
            exit 1
          fi

          URL="${SUPABASE_URL%/}/rest/v1/solicitudes?select=id&limit=1"
          echo "Pinging: ${SUPABASE_URL%/}/rest/v1/solicitudes?select=id&limit=1"

          # -s silencioso, -S muestra errores, -o body, -w status al final
          HTTP_CODE=$(curl -sS \
            -o response.txt \
            -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${URL}")

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response (primeros 200 chars):"
          head -c 200 response.txt || true
          echo

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Keepalive fallo con status ${HTTP_CODE}"
            exit 1
          fi

          echo "Keepalive OK"
